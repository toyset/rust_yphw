[package]
name = "quote"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3"
crossbeam = "0.8"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
env_logger = "0.10"
log = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[[bin]]
 name = "quote_server"
 path = "src/bin/quote_server.rs"

[[bin]]
name = "quote_client"
path = "src/bin/quote_client.rs"
